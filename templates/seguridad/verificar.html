{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verificación en dos pasos — JJ SPICH</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background-color: #0d0d0d;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image: radial-gradient(circle at 20% 50%, #1a0000 0%, #0d0d0d 60%);
    }

    .login-card {
      background: #111111;
      border-radius: 20px;
      padding: 2rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.5);
    }

    @media (max-width: 576px) {
      .login-card {
        margin: 16px;
        padding: 1.5rem;
      }
    }

    .btn-primary {
      background: #f97316 !important;
      border-color: #f97316 !important;
    }

    .btn-primary:hover {
      background: #ea6c0a !important;
      border-color: #ea6c0a !important;
    }

    .form-control {
      background: #1a1a1a;
      border-color: #333;
      color: white;
    }

    .form-control::placeholder {
      color: #555;
    }

    .form-control:focus {
      box-shadow: none;
      border-color: #f97316;
      background: #1a1a1a;
      color: white;
    }

    .text-muted {
      color: #888 !important;
    }

    hr {
      border-color: #2a2a2a;
    }

    .alert-danger {
      background: #2a0000;
      color: #f87171;
      border: 1px solid #7f1d1d !important;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="text-center mb-4">
      <i class="bi bi-shield-lock" style="font-size:3rem;color:#f97316;"></i>
      <h5 class="text-white mt-2 mb-1">Verificación en dos pasos</h5>
      <p class="text-muted small mb-0">
        Ingresa el código de 6 dígitos de tu aplicación de autenticación.
      </p>
    </div>

    {% if error %}
      <div class="alert alert-danger py-2 mb-3">
        <i class="bi bi-exclamation-circle me-1"></i>
        {{ error }}
      </div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label text-white">Código de autenticación</label>
        <input type="text" name="codigo" class="form-control text-center"
               maxlength="6" inputmode="numeric" autocomplete="one-time-code"
               placeholder="••••••" style="font-size:1.4rem;letter-spacing:8px;"
               required autofocus>
      </div>
      <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
        <i class="bi bi-box-arrow-in-right me-2"></i>Verificar e ingresar
      </button>
    </form>

    <hr class="my-4">
    <p class="text-center text-muted small mb-0">
      Usuario: <strong class="text-white">{{ usuario }}</strong>
    </p>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
